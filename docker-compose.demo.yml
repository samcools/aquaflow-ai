services:
  aquaflow:
    build: .
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 8000
      DEMO_MODE: "true"
      DEMO_ADMIN_EMAIL: demo@aquaflow.local
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-ChangeMe!2026}
      SESSION_SECRET: ${SESSION_SECRET:-local-demo-session-secret-change-before-sharing-2026}
      SESSION_TTL_SECONDS: 28800
      MAX_UPLOAD_MB: 10
    volumes:
      - aquaflow_data:/app/data
      - aquaflow_evidence:/app/storage/private
    restart: unless-stopped

volumes:
  aquaflow_data:
  aquaflow_evidence:
